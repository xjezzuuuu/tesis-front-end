<section class="mt-10 mb-10">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-7 col-lg-9">
        <div class="section-title text-center mb-40">
          <div class="section-icon">
            <img src="/assets/img/icon/pawprint.png" alt="" />
          </div>
          <div class="contact-title mb-20">
            <h2 class="title">Iniciar Sesion<span>.</span></h2>
          </div>
          <p>Estas a un paso de dar un hogar y mucho amor.</p>
        </div>
        <div class="col-xl-12 col-lg-9">
          <form
            action="#"
            class="contact-form"
            autocomplete="off"
            [formGroup]="miFormulario"
            (ngSubmit)="login()"
          >
            <div class="form-grp">
              <label for="email">Email <span>*</span></label>
              <input
                [(ngModel)]="email"
                type="email"
                formControlName="email"
                id="email"
                placeholder="dani.ejemplo@pongosietes.com"
              />
            </div>
            <div class="form-grp">
              <label for="password">Contraseña <span>*</span></label>
              <input
                [(ngModel)]="password"
                type="password"
                formControlName="password"
                id="password"
                placeholder="********"
              />
            </div>
            <button
              type="submit"
              class="btn rounded-btn"
              [disabled]="miFormulario.invalid"
            >
              Enviar
            </button>
            <br /><br />

            <div class="flex-col-c p-t-60">
              <span class="txt1 p-b-17"> ¿No tienes cuenta? </span>
              <a
                [routerLink]="['/auth/register']"
                routerLinkActive="router-link-active"
                class="txt2"
              >
                Crear una aquí
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
