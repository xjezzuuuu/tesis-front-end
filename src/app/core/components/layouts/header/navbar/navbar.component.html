<div id="sticky-header" class="menu-area">
  <div class="container custom-container">
    <div class="row">
      <div class="col-12">
        <div class="mobile-nav-toggler"><i class="fas fa-bars"></i></div>
        <div class="menu-wrap">
          <nav class="menu-nav show">
            <div class="logo">
              <a [routerLink]="['/']" routerLinkActive="router-link-active"
                ><img src="../assets/img/logo/logo.png" alt=""
              /></a>
            </div>
            <div class="navbar-wrap main-menu d-none d-lg-flex">
              <ul class="navigation">
                <li
                  [routerLinkActive]="['active']"
                  [routerLinkActiveOptions]="{ exact: true }"
                >
                  <a [routerLink]="['']">Inicio</a>
                </li>
                <li [routerLinkActive]="['active']">
                  <a [routerLink]="['/about']">Nosotros</a>
                </li>
                <li [routerLinkActive]="['active']">
                  <a [routerLink]="['/rescues']">Rescates</a>
                </li>
                <li [routerLinkActive]="['active']">
                  <a [routerLink]="['/adoptions']">Adopciones</a>
                </li>
                <li [routerLinkActive]="['active']">
                  <a [routerLink]="['/contact']">Contacto</a>
                </li>
              </ul>
            </div>
            <div class="header-action d-none d-md-block">
              <ul>
                <li class="header-search">
                  <a href="#"><i class="flaticon-search"></i></a>
                </li>
                <li class="header-btn">
                  <a
                    [routerLink]="['auth/login']"
                    routerLinkActive="router-link-active"
                    class="btn"
                    >Ingresar
                    <img src="../assets/img/icon/w_pawprint.png" alt=""
                  /></a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
        <!-- Mobile Menu  -->
        <div class="mobile-menu">
          <nav class="menu-box">
            <div class="close-btn"><i class="fas fa-times"></i></div>
            <div class="nav-logo">
              <a [routerLink]="['']" routerLinkActive="router-link-active"
                ><img src="../assets/img/logo/logo.png" alt="" title=""
              /></a>
            </div>
            <div class="menu-outer">
              <ul class="navigation">
                <li>
                  <a [routerLink]="['/']" routerLinkActive="router-link-active"
                    >Inicio</a
                  >
                </li>
                <li>
                  <a
                    [routerLink]="['/about']"
                    routerLinkActive="router-link-active"
                    >Nosotros</a
                  >
                </li>
                <li>
                  <a
                    [routerLink]="['/rescues']"
                    routerLinkActive="router-link-active"
                    >Rescates</a
                  >
                </li>
                <li>
                  <a
                    [routerLink]="['/adoptions']"
                    routerLinkActive="router-link-active"
                    >Adopciones</a
                  >
                </li>
                <li>
                  <a
                    [routerLink]="['/contact']"
                    routerLinkActive="router-link-active"
                    >Contacto</a
                  >
                </li>
              </ul>
              <br />
            </div>
            <div class="social-links">
              <ul class="clearfix">
                <li>
                  <button
                    [routerLink]="['auth/login']"
                    routerLinkActive="router-link-active"
                    type="button"
                    class="btn btn-primary btn-sm"
                  >
                    Ingresar
                  </button>
                </li>
                <li>
                  <button
                    [routerLink]="['auth/register']"
                    routerLinkActive="router-link-active"
                    type="button"
                    class="btn btn-xs btn-primary"
                  >
                    Registrarse
                  </button>
                </li>
              </ul>
            </div>
            <div class="social-links">
              <ul class="clearfix">
                <li>
                  <a href="#"><span class="fab fa-twitter"></span></a>
                </li>
                <li>
                  <a href="#"><span class="fab fa-facebook-square"></span></a>
                </li>
                <li>
                  <a href="#"><span class="fab fa-pinterest-p"></span></a>
                </li>
                <li>
                  <a href="#"><span class="fab fa-instagram"></span></a>
                </li>
                <li>
                  <a href="#"><span class="fab fa-youtube"></span></a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
        <div class="menu-backdrop"></div>
        <!-- End Mobile Menu -->
      </div>
    </div>
  </div>
  <div
    class="header-shape"
    style="background-image: url('../assets/img/bg/header_shape.png')"
  ></div>
</div>
<!-- header-search -->
<div class="search-popup-wrap" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="search-close">
    <span><i class="fas fa-times"></i></span>
  </div>
  <div class="search-wrap text-center">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <h2 class="title">... Search Here ...</h2>
          <div class="search-form">
            <form action="#">
              <input
                type="text"
                name="search"
                placeholder="Type keywords here"
              />
              <button class="search-btn"><i class="fas fa-search"></i></button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- header-search-end -->
