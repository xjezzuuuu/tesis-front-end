<!-- testimonial-area -->
<section class="testimonial-area testimonial-bg">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-7 col-lg-9">
        <div class="section-title text-center mb-65">
          <div class="section-icon">
            <img src="img/icon/pawprint.png" alt="" />
          </div>
          <h5 class="sub-title">Testimonios</h5>
          <h2 class="title">Algunos testimonios de nuestr@s usuarios</h2>
        </div>
      </div>
    </div>
    <ngx-slick-carousel
      class="row testimonial-active"
      #slickModal="slick-carousel"
      [config]="slideConfig"
    >
      <div ngxSlickItem *ngFor="let testimonial of testimonials" class="col-lg-6">
        <div class="testimonial-item">
          <div class="testi-avatar-thumb">
            <img src="{{testimonial.photo}}" alt="" />
          </div>
          <div class="testi-content">
            <p>{{testimonial.testimonial}}</p>
            <div class="testi-avatar-info">
              <h5 class="title">{{testimonial.name}}</h5>
              <span>{{testimonial.position}}</span>
            </div>
          </div>
        </div>
      </div>
    </ngx-slick-carousel>
  </div>
</section>
<!-- testimonial-area-end -->
